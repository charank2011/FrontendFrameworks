<!DOCTYPE html>
<html lang="en">
<head>
    <title> Registration form </title>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style> 
        body{
            background-image: url(https://thumbs.dreamstime.com/z/logo-de-la-marca-amazon-american-international-commerce-company-toma-estudio-209364080.jpg?ct=jpeg);
            color: aliceblue;
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>Login</h1>
    <form action="none">
        <fieldset>
            <legend >Registration Form</legend>
        <p>Username:
            <input type="text" id="username" name="name" style="width: 15%;">
        </p>
        <p>Password:
            <input type ="password" id="password" name="password">
            <br>
          Date Of Birth:  <input type="date" id=" Date of birth" name="DOB">
    
        </p>

        <label>Existing User</label>
        <input type="radio" id="Existing User" name="Existing User">
        <label>Sign In</label>
        <input type="radio" id="Sign In" name="Sign In">
        <br>
        
            
        
        <input type ="submit" name = "submit" value="SUBMIT">

        </fieldset>
        
    </form>
</body>
</html>
